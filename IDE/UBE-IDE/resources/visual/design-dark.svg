<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" data-presentation="Design" data-theme="dark" role="img" aria-labelledby="title desc">
  <title id="title">UBE IDE Design layout, dark theme</title><desc id="desc">Form designer with toolbox left and project and properties tools right.</desc>
  <style>:root{--canvas:#181A1C;--panel:#24272A;--editor:#1D2022;--text:#F1F3F5;--muted:#B4BBC2;--border:#8A929A;--selection:#285878;--selection-text:#FFFFFF;--focus:#78BEFF;--success:#72D69A;--warning:#FFCA75}.ui{font:13px "Segoe UI",Tahoma,sans-serif;fill:var(--text)}.small{font-size:11px}.muted{fill:var(--muted)}.line{stroke:var(--border)}</style>
  <rect width="1200" height="760" fill="var(--canvas)"/><rect x="12" y="12" width="1176" height="736" rx="5" fill="var(--panel)" stroke="var(--border)"/>
