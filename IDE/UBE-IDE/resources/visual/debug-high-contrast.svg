<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" data-presentation="Debug" data-theme="high-contrast" role="img" aria-labelledby="title desc">
  <title id="title">UBE IDE Debug layout, high contrast theme</title><desc id="desc">Paused source with explicit current-line label, stack, registers, and immediate tools.</desc>
  <style>:root{--canvas:#000;--panel:#000;--editor:#000;--text:#FFF;--muted:#E6E6E6;--border:#FFF;--selection:#00FFFF;--selection-text:#000;--focus:#FFFF00;--debug:#FFFF00;--changed:#FF80FF;--error:#FF7B7B}.ui{font:13px "Segoe UI",Tahoma,sans-serif;fill:var(--text)}.small{font-size:11px}.mono{font:14px "Cascadia Mono",Consolas,monospace}.muted{fill:var(--muted)}.box{fill:var(--panel);stroke:var(--border);stroke-width:2}</style>
  <rect width="1200" height="760" fill="var(--canvas)"/><rect x="10" y="10" width="1180" height="740" class="box"/><text class="ui" x="26" y="34">File   Edit   View   Project   Build   Debug   Tools   Window   Help</text><rect x="11" y="46" width="1178" height="32" fill="var(--panel)" stroke="var(--border)"/><text class="ui" x="28" y="67">▶ Continue    ‖ Pause    ■ Stop    ↷ Step Into    → Step Over</text>
  <rect x="11" y="78" width="780" height="444" class="box"/><text class="ui" x="27" y="104">Main.bas</text><line x1="11" y1="116" x2="791" y2="116" stroke="var(--border)" stroke-width="2"/><rect x="12" y="218" width="778" height="30" fill="var(--debug)"/><polygon points="20,226 30,233 20,240" fill="var(--canvas)"/><text class="ui small" x="39" y="238" fill="var(--canvas)">CURRENT EXECUTION LINE</text>
  <g class="mono"><text x="54" y="151" fill="var(--muted)">12</text><text x="92" y="151" fill="var(--text)">Public Sub Calculate()</text><text x="54" y="181" fill="var(--muted)">13</text><text x="116" y="181" fill="var(--text)">Dim Total As Long</text><text x="54" y="211" fill="var(--muted)">14</text><text x="116" y="211" fill="var(--text)">Total = Count * 2</text><text x="54" y="271" fill="var(--muted)">15</text><text x="116" y="271" fill="var(--text)">Print Total</text><text x="54" y="301" fill="var(--muted)">16</text><text x="92" y="301" fill="var(--text)">End Sub</text></g>
  <rect x="791" y="78" width="398" height="220" class="box"/><text class="ui" x="807" y="104">Call Stack</text><line x1="791" y1="116" x2="1189" y2="116" stroke="var(--border)" stroke-width="2"/><rect x="803" y="128" width="374" height="31" fill="var(--selection)"/><text class="ui" x="817" y="149" fill="var(--selection-text)">1  Calculate · Main.bas:14</text><text class="ui" x="817" y="183">2  Main · Main.bas:6</text>
  <rect x="791" y="298" width="398" height="224" class="box"/><text class="ui" x="807" y="324">Registers · paused snapshot</text><line x1="791" y1="336" x2="1189" y2="336" stroke="var(--border)" stroke-width="2"/><text class="ui small muted" x="807" y="360">NAME</text><text class="ui small muted" x="930" y="360">VALUE</text><text class="mono" x="807" y="390">RAX</text><text class="mono" x="930" y="390">000000000000002A</text><text class="mono" x="807" y="420">RBX</text><text class="mono" x="930" y="420" fill="var(--changed)">0000000000000002  CHANGED</text><text class="mono" x="807" y="450">RIP</text><text class="mono" x="930" y="450">00007FF612341060</text><text class="ui small" x="807" y="488">Exact · thread 1 · frame 1 · age 0 ms</text>
  <rect x="11" y="522" width="1178" height="198" class="box"/><text class="ui" x="27" y="548">Immediate</text><text class="ui" x="112" y="548">Locals</text><text class="ui" x="173" y="548">Watches</text><text class="ui" x="248" y="548">Output</text><line x1="24" y1="558" x2="91" y2="558" stroke="var(--focus)" stroke-width="3"/><text class="mono" x="28" y="595">? Total</text><text class="mono" x="28" y="625">42</text><rect x="25" y="646" width="405" height="32" fill="none" stroke="var(--focus)" stroke-width="3"/><text class="mono muted" x="34" y="668">Enter expression</text><text class="ui small" x="465" y="668" fill="var(--error)">ERROR: optimized value unavailable</text>
  <rect x="11" y="720" width="1178" height="29" fill="var(--panel)"/><text class="ui small" x="26" y="740">Paused · x86-64 · Current line also marked by arrow and label</text><text class="ui small" x="1040" y="740">High contrast · 200%</text>
</svg>
