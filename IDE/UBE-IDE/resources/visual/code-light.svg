<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" data-presentation="Code" data-theme="light" role="img" aria-labelledby="title desc">
  <title id="title">UBE IDE Code layout, light theme</title>
  <desc id="desc">A compact native code workspace with project explorer on the right and output below.</desc>
  <style>
    :root{--canvas:#F3F1EB;--panel:#FFFFFF;--editor:#FFFEFA;--text:#202428;--muted:#596169;--border:#747B82;--selection:#C9E3F7;--selection-text:#17232D;--focus:#005EA8;--keyword:#004F9E;--type:#681C91;--string:#086B38;--number:#8A3B00;--comment:#59636D;--procedure:#704D00;--error:#B3261E}
    .ui{font:13px "Segoe UI",Tahoma,sans-serif;fill:var(--text)}.small{font-size:11px}.muted{fill:var(--muted)}.mono{font:14px "Cascadia Mono",Consolas,monospace}.line{fill:none;stroke:var(--border)}.icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1200" height="760" fill="var(--canvas)"/>
  <rect x="12" y="12" width="1176" height="736" rx="5" fill="var(--panel)" stroke="var(--border)"/>
  <rect x="13" y="13" width="1174" height="28" rx="4" fill="var(--panel)"/><text class="ui" x="26" y="32">File   Edit   View   Project   Build   Debug   Tools   Window   Help</text>
  <rect x="13" y="41" width="1174" height="34" fill="var(--canvas)" stroke="var(--border)"/>
  <g class="icon" color="var(--text)" transform="translate(28 49)"><path d="M1 2h10l3 3v15H1zM4 2v6h7V2M4 20v-8h8v8"/></g><text class="ui muted small" x="52" y="63">Save</text>
  <g class="icon" color="var(--text)" transform="translate(104 49)"><path d="M1 12L13 3v18z"/></g><text class="ui muted small" x="126" y="63">Run</text>
  <rect x="13" y="75" width="1174" height="26" fill="var(--panel)" stroke="var(--border)"/><rect x="23" y="78" width="228" height="23" fill="var(--editor)" stroke="var(--border)"/><text class="ui" x="35" y="95">Main.bas</text><circle cx="236" cy="89" r="3" fill="var(--error)"/>
  <rect x="13" y="101" width="878" height="475" fill="var(--editor)"/>
  <rect x="13" y="101" width="45" height="475" fill="var(--canvas)"/><text class="mono muted" text-anchor="end" x="48" y="133">1</text><text class="mono muted" text-anchor="end" x="48" y="157">2</text><text class="mono muted" text-anchor="end" x="48" y="181">3</text><text class="mono muted" text-anchor="end" x="48" y="205">4</text><text class="mono muted" text-anchor="end" x="48" y="229">5</text><text class="mono muted" text-anchor="end" x="48" y="253">6</text>
  <g class="mono"><text x="70" y="133" fill="var(--keyword)">Public Function</text><text x="202" y="133" fill="var(--procedure)">Main</text><text x="236" y="133" fill="var(--text)">() </text><text x="262" y="133" fill="var(--keyword)">As</text><text x="286" y="133" fill="var(--type)"> Long</text><text x="94" y="157" fill="var(--comment)">' Clear, familiar, native.</text><text x="94" y="181" fill="var(--text)">Dim Greeting </text><text x="204" y="181" fill="var(--keyword)">As</text><text x="228" y="181" fill="var(--type)"> String</text><rect x="88" y="190" width="330" height="23" fill="var(--selection)"/><text x="94" y="205" fill="var(--selection-text)">Greeting = "Hello from UBE"</text><text x="94" y="229" fill="var(--procedure)">Print</text><text x="136" y="229" fill="var(--text)"> Greeting</text><text x="70" y="253" fill="var(--keyword)">End Function</text></g>
  <rect x="67" y="272" width="4" height="22" fill="var(--focus)"/>
  <rect x="891" y="101" width="296" height="300" fill="var(--panel)" stroke="var(--border)"/><text class="ui" x="907" y="126">Project Explorer</text><line x1="891" y1="136" x2="1187" y2="136" class="line"/><text class="ui" x="909" y="164">▾  HelloProject</text><text class="ui" x="931" y="190">◇  Main.bas</text><text class="ui muted" x="931" y="216">◇  Strings.bas</text>
  <rect x="891" y="401" width="296" height="175" fill="var(--panel)" stroke="var(--border)"/><text class="ui" x="907" y="426">Properties</text><line x1="891" y1="436" x2="1187" y2="436" class="line"/><text class="ui muted" x="907" y="464">Name</text><text class="ui" x="1010" y="464">Main</text><text class="ui muted" x="907" y="490">Kind</text><text class="ui" x="1010" y="490">Module</text>
  <rect x="13" y="576" width="1174" height="145" fill="var(--panel)" stroke="var(--border)"/><text class="ui" x="29" y="601">Problems</text><text class="ui" x="104" y="601">Output</text><line x1="100" y1="607" x2="153" y2="607" stroke="var(--focus)" stroke-width="2"/><text class="mono muted small" x="29" y="636">Build succeeded · 0 errors · 0 warnings · 184 ms</text><text class="ui muted small" x="29" y="671">Long-label check: Project-local customization of standard-library definition</text><text class="ui muted small" x="29" y="697" direction="rtl">اختبار اتجاه النص والوصول</text>
  <rect x="13" y="721" width="1174" height="26" fill="var(--canvas)"/><text class="ui small" x="27" y="739">Ready</text><text class="ui small muted" x="1000" y="739">Ln 4, Col 5   UTF-8   100%</text>
</svg>
